<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1550" viewBox="0 0 2400 1550" role="img" aria-labelledby="title desc">
  <title id="title">Teyvat Lexicon desktop framework comparison</title>
  <desc id="desc">Three sketches compare the current Tauri popover, a Wails version 3 tray-attached Svelte window, and a Neutralino native tray menu. All show the same translation desk design.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#21152e" flood-opacity=".2"/></filter>
    <style>
      text { font-family: "Avenir Next", "Nunito", system-ui, sans-serif; fill: #2a2f5a; }
      .ink { fill: #2a2f5a; } .muted { fill: #545878; } .white { fill: #fff; }
      .native-menu-text { fill: #f4f3f5; } .native-menu-muted { fill: #aaa8ad; }
      .eyebrow { font-size: 18px; font-weight: 800; letter-spacing: 3px; fill: #62547d; }
      .title { font-size: 57px; font-weight: 900; letter-spacing: -2px; }
      .intro { font-size: 25px; fill: #545878; }
      .card-title { font-size: 28px; font-weight: 900; }
      .card-sub { font-size: 18px; fill: #545878; }
      .label { font-size: 14px; font-weight: 900; letter-spacing: 1.2px; }
      .body { font-size: 17px; }
      .small { font-size: 15px; }
      .metric { font-size: 16px; }
      .metric-value { font-size: 15px; font-weight: 900; text-anchor: end; }
    </style>
  </defs>
  <rect width="2400" height="1550" fill="#fff9ef"/>
  <text x="90" y="94" class="eyebrow">DESKTOP BUILD OPTIONS · MACOS + WINDOWS</text>
  <text x="90" y="160" class="title">One translation desk, three native shells</text>
  <text x="90" y="201" class="intro">Same playful interface and FastAPI service in each sketch; the tray and popup behavior is what changes.</text>

  <!-- Card 1: current Tauri implementation -->
  <g transform="translate(90,238)">
    <rect width="710" height="1127" rx="27" fill="#fffdf8" stroke="#e6d8c8" stroke-width="2"/>
    <text x="25" y="49" class="card-title">Tauri · current</text>
    <rect x="463" y="19" width="222" height="38" rx="19" fill="#e6f7ef"/>
    <text x="574" y="44" text-anchor="middle" class="small" font-weight="800">ALREADY IMPLEMENTED</text>
    <text x="25" y="87" class="card-sub">Custom webview popover under the menu-bar icon.</text>
    <text x="25" y="115" class="card-sub">Full desk and quick translator share one React UI.</text>
    <g transform="translate(24,140)">
      <rect width="662" height="548" rx="17" fill="#f2edf2" stroke="#dcd5ce" stroke-width="2"/>
      <path d="M17 45h628v479H17z" fill="#fff6e8" opacity=".77"/>
      <rect width="662" height="44" rx="17" fill="#222126"/>
      <rect y="27" width="662" height="17" fill="#222126"/>
      <text x="18" y="29" font-size="16" class="white">◉　<tspan font-weight="800">Teyvat Lexicon</tspan>　 File　 Window</text>
      <text x="468" y="29" font-size="15" class="white">⌁　◖　◉　12:42</text>
      <text x="32" y="93" font-size="23" font-weight="900">✦　Teyvat Lexicon</text>
      <text x="32" y="150" font-size="36" font-weight="900">Character Index</text>
      <rect x="32" y="169" width="564" height="13" rx="7" fill="#eadff1"/>
      <rect x="32" y="194" width="325" height="13" rx="7" fill="#eadff1"/>
      <rect x="32" y="225" width="270" height="168" rx="17" fill="#ffe4ee" stroke="#f6c7d8"/>
      <rect x="318" y="225" width="278" height="168" rx="17" fill="#e3f1ff" stroke="#c5def5"/>
      <circle cx="535" cy="13" r="12" fill="#f5d7ff" stroke="#fff" stroke-width="3"/>
      <g filter="url(#shadow)" transform="translate(304,58)">
        <rect width="338" height="451" rx="19" fill="#fff6e8" stroke="#eadccf" stroke-width="2"/>
        <rect x="17" y="17" width="38" height="38" rx="13" fill="#ede4ff"/>
        <text x="36" y="44" text-anchor="middle" font-size="23">📖</text>
        <text x="66" y="34" font-size="17" font-weight="900">Teyvat Lexicon</text>
        <text x="66" y="51" font-size="12" font-weight="900" letter-spacing="1.1">QUICK TRANSLATE</text>
        <rect x="245" y="23" width="81" height="29" rx="15" fill="#e6f7ef" stroke="#a8ddc6"/>
        <circle cx="258" cy="37" r="4" fill="#42ad78"/>
        <text x="266" y="42" font-size="12" font-weight="900">API ready</text>
        <text x="17" y="82" class="label">TRANSLATE A LINE</text>
        <text x="308" y="82" text-anchor="end" class="label">RU →</text>
        <rect x="17" y="93" width="70" height="30" rx="15" fill="#ede4ff" stroke="#d9c9f1"/>
        <rect x="92" y="93" width="77" height="30" rx="15" fill="#ff6ba7" stroke="#ef4c93"/>
        <rect x="174" y="93" width="86" height="30" rx="15" fill="#ede4ff" stroke="#d9c9f1"/>
        <rect x="265" y="93" width="59" height="30" rx="15" fill="#ede4ff" stroke="#d9c9f1"/>
        <text x="52" y="113" text-anchor="middle" font-size="12" font-weight="800">English</text>
        <text x="130" y="113" text-anchor="middle" font-size="12" font-weight="800">Japanese</text>
        <text x="217" y="113" text-anchor="middle" font-size="12" font-weight="800">简体中文</text>
        <text x="295" y="113" text-anchor="middle" font-size="12" font-weight="800">繁體</text>
        <text x="17" y="150" class="label">SOURCE TEXT</text><text x="324" y="150" text-anchor="end" font-size="13" font-weight="800">🎙 Speak</text>
        <rect x="17" y="160" width="307" height="93" rx="13" fill="#ffe4ee" stroke="#f1bfd2"/>
        <text x="31" y="181" font-size="12" font-weight="900" letter-spacing="1">PASTE OR TYPE</text>
        <text x="31" y="207" font-size="14" fill="#4f5478">Привет, Путешественник!</text>
        <text x="31" y="230" font-size="14" fill="#4f5478">Добро пожаловать в Мондштадт.</text>
        <text x="17" y="280" class="label">TRANSLATION</text><text x="324" y="280" text-anchor="end" class="label">JAPANESE</text>
        <rect x="17" y="291" width="307" height="66" rx="13" fill="#e3f1ff" stroke="#c4def7"/>
        <text x="31" y="330" font-size="15" font-weight="800" fill="#545878">翻訳がここに表示されます</text>
        <rect x="76" y="373" width="188" height="40" rx="20" fill="#ff6ba7"/>
        <text x="170" y="399" text-anchor="middle" font-size="14" font-weight="900">Translate line ✨</text>
        <text x="169" y="437" text-anchor="middle" font-size="12" fill="#545878">⌘ / Ctrl + Enter · no saved history</text>
      </g>
    </g>
    <rect x="24" y="710" width="662" height="126" rx="16" fill="#f5f0fc"/>
    <text x="43" y="744" font-size="18" font-weight="900">Strongest today</text>
    <text x="43" y="775" class="body">Tray, global shortcut, quick popover, Settings, and the</text>
    <text x="43" y="801" class="body">Windows installer are already handled by this shell.</text>
    <text x="43" y="824" class="body">Build: 9.42 MiB; Svelte can swap in without shell changes.</text>
    <text x="43" y="882" class="metric muted">Cross-platform</text><text x="660" y="882" class="metric-value">macOS + Windows</text>
    <text x="43" y="928" class="metric muted">Popup fidelity</text><text x="660" y="928" class="metric-value">Custom, full UI</text>
    <text x="43" y="974" class="metric muted">Switching cost</text><text x="660" y="974" class="metric-value">None</text>
    <line x1="24" y1="1010" x2="686" y2="1010" stroke="#eee3d7" stroke-width="2"/>
    <text x="43" y="1051" class="label">BEST IF YOU WANT</text>
    <text x="43" y="1085" class="body">The smallest complete build. Svelte can replace React</text>
    <text x="43" y="1112" class="body">while keeping the existing native tray behavior.</text>
  </g>

  <!-- Card 2: Wails v3 -->
  <g transform="translate(845,238)">
    <rect width="710" height="1127" rx="27" fill="#fffdf8" stroke="#e6d8c8" stroke-width="2"/>
    <text x="25" y="49" class="card-title">Wails v3 + Svelte</text>
    <rect x="421" y="19" width="264" height="38" rx="19" fill="#ede4ff"/>
    <text x="553" y="44" text-anchor="middle" class="small" font-weight="800">BEST ALTERNATE TO PROTOTYPE</text>
    <text x="25" y="87" class="card-sub">Svelte in a Go shell; Wails attaches a real window</text>
    <text x="25" y="115" class="card-sub">to the tray icon and hides it when focus is lost.</text>
    <g transform="translate(24,140)">
      <rect width="662" height="548" rx="17" fill="#f2edf2" stroke="#dcd5ce" stroke-width="2"/>
      <path d="M17 45h628v479H17z" fill="#fff6e8" opacity=".77"/>
      <rect width="662" height="44" rx="17" fill="#222126"/><rect y="27" width="662" height="17" fill="#222126"/>
      <text x="18" y="29" font-size="16" class="white">◉　<tspan font-weight="800">Teyvat Lexicon</tspan>　 File　 Window</text><text x="468" y="29" font-size="15" class="white">⌁　◖　◉　12:42</text>
      <text x="32" y="93" font-size="23" font-weight="900">✦　Teyvat Lexicon</text><text x="32" y="150" font-size="36" font-weight="900">Character Index</text>
      <rect x="32" y="169" width="564" height="13" rx="7" fill="#eadff1"/><rect x="32" y="194" width="325" height="13" rx="7" fill="#eadff1"/>
      <rect x="32" y="225" width="270" height="168" rx="17" fill="#ffe4ee" stroke="#f6c7d8"/><rect x="318" y="225" width="278" height="168" rx="17" fill="#e3f1ff" stroke="#c5def5"/>
      <circle cx="535" cy="13" r="12" fill="#f5d7ff" stroke="#fff" stroke-width="3"/>
      <g filter="url(#shadow)" transform="translate(304,58)">
        <rect width="338" height="451" rx="19" fill="#fff6e8" stroke="#eadccf" stroke-width="2"/>
        <rect x="17" y="17" width="38" height="38" rx="13" fill="#ede4ff"/><text x="36" y="44" text-anchor="middle" font-size="23">📖</text>
        <text x="66" y="34" font-size="17" font-weight="900">Teyvat Lexicon</text><text x="66" y="51" font-size="12" font-weight="900" letter-spacing="1.1">QUICK TRANSLATE</text>
        <rect x="245" y="23" width="81" height="29" rx="15" fill="#e6f7ef" stroke="#a8ddc6"/><circle cx="258" cy="37" r="4" fill="#42ad78"/><text x="266" y="42" font-size="12" font-weight="900">API ready</text>
        <text x="17" y="82" class="label">TRANSLATE A LINE</text><text x="308" y="82" text-anchor="end" class="label">RU →</text>
        <rect x="17" y="93" width="70" height="30" rx="15" fill="#ede4ff" stroke="#d9c9f1"/><rect x="92" y="93" width="77" height="30" rx="15" fill="#ff6ba7" stroke="#ef4c93"/><rect x="174" y="93" width="86" height="30" rx="15" fill="#ede4ff" stroke="#d9c9f1"/><rect x="265" y="93" width="59" height="30" rx="15" fill="#ede4ff" stroke="#d9c9f1"/>
        <text x="52" y="113" text-anchor="middle" font-size="12" font-weight="800">English</text><text x="130" y="113" text-anchor="middle" font-size="12" font-weight="800">Japanese</text><text x="217" y="113" text-anchor="middle" font-size="12" font-weight="800">简体中文</text><text x="295" y="113" text-anchor="middle" font-size="12" font-weight="800">繁體</text>
        <text x="17" y="150" class="label">SOURCE TEXT</text><text x="324" y="150" text-anchor="end" font-size="13" font-weight="800">🎙 Speak</text>
        <rect x="17" y="160" width="307" height="93" rx="13" fill="#ffe4ee" stroke="#f1bfd2"/><text x="31" y="181" font-size="12" font-weight="900" letter-spacing="1">PASTE OR TYPE</text><text x="31" y="207" font-size="14" fill="#4f5478">Привет, Путешественник!</text><text x="31" y="230" font-size="14" fill="#4f5478">Добро пожаловать в Мондштадт.</text>
        <text x="17" y="280" class="label">TRANSLATION</text><text x="324" y="280" text-anchor="end" class="label">JAPANESE</text><rect x="17" y="291" width="307" height="66" rx="13" fill="#e3f1ff" stroke="#c4def7"/><text x="31" y="330" font-size="15" font-weight="800" fill="#545878">翻訳がここに表示されます</text>
        <rect x="76" y="373" width="188" height="40" rx="20" fill="#ff6ba7"/><text x="170" y="399" text-anchor="middle" font-size="14" font-weight="900">Translate line ✨</text><text x="169" y="437" text-anchor="middle" font-size="12" fill="#545878">⌘ / Ctrl + Enter · no saved history</text>
      </g>
    </g>
    <rect x="24" y="710" width="662" height="126" rx="16" fill="#f5f0fc"/>
    <text x="43" y="744" font-size="18" font-weight="900">Why test it</text>
    <text x="43" y="775" class="body">Its tray API owns the attached-window behavior. One</text>
    <text x="43" y="801" class="body">Svelte view can power the quick popup and full desk.</text>
    <text x="43" y="824" class="body">But it adds a new Go toolchain and shell migration.</text>
    <text x="43" y="882" class="metric muted">Cross-platform</text><text x="660" y="882" class="metric-value">macOS + Windows</text>
    <text x="43" y="928" class="metric muted">Popup fidelity</text><text x="660" y="928" class="metric-value">Custom, full UI</text>
    <text x="43" y="974" class="metric muted">Documented release size</text><text x="660" y="974" class="metric-value">~10–15 MB</text>
    <line x1="24" y1="1010" x2="686" y2="1010" stroke="#eee3d7" stroke-width="2"/>
    <text x="43" y="1051" class="label">BEST IF YOU WANT</text>
    <text x="43" y="1085" class="body">A simpler tray-anchored window and a Svelte UI,</text>
    <text x="43" y="1112" class="body">even without a clear bundle-size win.</text>
  </g>

  <!-- Card 3: Neutralino -->
  <g transform="translate(1600,238)">
    <rect width="710" height="1127" rx="27" fill="#fffdf8" stroke="#e6d8c8" stroke-width="2"/>
    <text x="25" y="49" class="card-title">Neutralinojs + Svelte</text>
    <rect x="495" y="19" width="190" height="38" rx="19" fill="#fff0b8"/>
    <text x="590" y="44" text-anchor="middle" class="small" font-weight="800">SMALLEST RUNTIME</text>
    <text x="25" y="87" class="card-sub">Lightweight webview shell with a native tray menu.</text>
    <text x="25" y="115" class="card-sub">The tray menu itself is not a rich translator popup.</text>
    <g transform="translate(24,140)">
      <rect width="662" height="548" rx="17" fill="#f2edf2" stroke="#dcd5ce" stroke-width="2"/>
      <path d="M17 45h628v479H17z" fill="#fff6e8" opacity=".77"/>
      <rect width="662" height="44" rx="17" fill="#222126"/><rect y="27" width="662" height="17" fill="#222126"/>
      <text x="18" y="29" font-size="16" class="white">◉　<tspan font-weight="800">Teyvat Lexicon</tspan>　 File　 Window</text><text x="468" y="29" font-size="15" class="white">⌁　◖　◉　12:42</text>
      <text x="32" y="93" font-size="23" font-weight="900">✦　Teyvat Lexicon</text><text x="32" y="150" font-size="36" font-weight="900">Character Index</text>
      <rect x="32" y="169" width="564" height="13" rx="7" fill="#eadff1"/><rect x="32" y="194" width="325" height="13" rx="7" fill="#eadff1"/><rect x="32" y="225" width="270" height="168" rx="17" fill="#ffe4ee" stroke="#f6c7d8"/><rect x="318" y="225" width="278" height="168" rx="17" fill="#e3f1ff" stroke="#c5def5"/>
      <circle cx="535" cy="13" r="12" fill="#f5d7ff" stroke="#fff" stroke-width="3"/>
      <g filter="url(#shadow)" transform="translate(372,60)">
        <rect width="250" height="268" rx="13" fill="#252428" stroke="#47454b" stroke-width="2"/>
        <text x="20" y="34" class="native-menu-text" font-size="15" font-family="-apple-system, sans-serif" font-weight="700">📖　Teyvat Lexicon</text><circle cx="222" cy="29" r="5" fill="#45c77c"/>
        <text x="20" y="66" class="native-menu-muted" font-size="14" font-family="-apple-system, sans-serif">Local API · ready</text>
        <line x1="12" y1="82" x2="238" y2="82" stroke="#48464c"/>
        <text x="20" y="111" class="native-menu-text" font-size="15" font-family="-apple-system, sans-serif">Open Translation Desk</text>
        <text x="20" y="148" class="native-menu-text" font-size="15" font-family="-apple-system, sans-serif">Quick Translate…</text>
        <text x="20" y="185" class="native-menu-text" font-size="15" font-family="-apple-system, sans-serif">Settings…</text>
        <line x1="12" y1="201" x2="238" y2="201" stroke="#48464c"/>
        <text x="20" y="235" class="native-menu-text" font-size="15" font-family="-apple-system, sans-serif">Quit Teyvat Lexicon</text>
      </g>
    </g>
    <rect x="24" y="710" width="662" height="126" rx="16" fill="#fff7dd"/>
    <text x="43" y="744" font-size="18" font-weight="900">Why it may not fit</text>
    <text x="43" y="775" class="body">Its tray API exposes native menu items, not an</text>
    <text x="43" y="801" class="body">attached custom window. Global shortcuts need extra</text>
    <text x="43" y="824" class="body">native work; a rich popup would erase some simplicity.</text>
    <text x="43" y="882" class="metric muted">Cross-platform</text><text x="660" y="882" class="metric-value">macOS + Windows</text>
    <text x="43" y="928" class="metric muted">Popup fidelity</text><text x="660" y="928" class="metric-value">Native menu only</text>
    <text x="43" y="974" class="metric muted">Documented base app</text><text x="660" y="974" class="metric-value">~2 MB</text>
    <line x1="24" y1="1010" x2="686" y2="1010" stroke="#eee3d7" stroke-width="2"/>
    <text x="43" y="1051" class="label">BEST IF YOU WANT</text>
    <text x="43" y="1085" class="body">The smallest app and can accept a native menu</text>
    <text x="43" y="1112" class="body">instead of the current rich quick-translate UI.</text>
  </g>

  <rect x="90" y="1393" width="2220" height="92" rx="20" fill="#fffdf8" stroke="#e7d9c8" stroke-width="2"/>
  <text x="118" y="1431" font-size="18" font-weight="900">RECOMMENDATION</text>
  <text x="118" y="1462" font-size="18">Keep Tauri for smallest complete build; prototype Wails v3 + Svelte only if tray simplicity is worth a likely size increase.</text>
  <text x="2280" y="1431" text-anchor="end" font-size="15" font-weight="700" fill="#545878">Concept sketches — not three live builds</text>
  <text x="2280" y="1462" text-anchor="end" font-size="15" fill="#545878">Wails / Neutralino figures are upstream estimates.</text>
</svg>
