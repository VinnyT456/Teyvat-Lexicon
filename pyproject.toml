[project]
name = "genshin-translation-agent"
version = "0.1.0"
description = "Local FastAPI service for Genshin Impact translation"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "chromadb>=1.0.0",
    "fastapi>=0.115.0",
    "fugashi[unidic-lite]>=1.5.2",
    "jaconv>=0.5.0",
    "kokoro>=0.9.4",
    "misaki[zh]>=0.9.4",
    "mojimoji>=0.0.13",
    "numpy>=2.0.2",
    "openai>=3.44.0",
    "pyopenjtalk>=0.4.1",
    "pypinyin>=0.55.0",
    "pydantic>=2.14.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    "uvicorn>=0.34.0",
    "faster-whisper>=1.2.0",
]
