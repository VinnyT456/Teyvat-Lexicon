[package]
name = "genshin-translation-desk"
version = "0.1.0"
description = "A local translation desk for Genshin Impact"
edition = "2021"

[lib]
name = "genshin_translation_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
